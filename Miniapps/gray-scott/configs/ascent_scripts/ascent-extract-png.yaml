- action: "add_scenes"
  scenes:
    v_volume:
      plots:
        volume_plot:
          type: "volume"
          field: "v"
          # Samples per ray. The default (100) is under one sample per cell across
          # a 64^3 grid: it bands, and at rank boundaries it streaks differently
          # for each rank count. About 9 per cell along the diagonal (1000 for
          # L = 64; scale with L) makes 8 ranks match 1 rank. Costs about 3 s per
          # frame on one rank at 64^3.
          samples: 1000
          color_table:
            control_points:
              - type: "rgb"
                position: 0.0
                color: [0.231, 0.298, 0.753]  # Blue
              - type: "rgb"
                position: 0.300345
                color: [0.865, 0.865, 0.865]  # Gray
              - type: "rgb"
                position: 0.600691
                color: [0.706, 0.016, 0.149]  # Red
              - type: "alpha"
                position: 0.0
                alpha: 0.0
              - type: "alpha"
                position: 0.600691
                alpha: 1.0
      renders:
        render1:
          image_width: 2113
          image_height: 1338
          annotations: "on"
          image_prefix: "ascent_render_v"
          camera:
            position: [9.742, 8.216, 10.431]
            look_at:  [3.25, 3.25, 3.25]
            up:       [-0.47618, 0.86344, -0.16649]