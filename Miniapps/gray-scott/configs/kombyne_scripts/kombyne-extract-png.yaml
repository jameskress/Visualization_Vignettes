pipelines:
  # This pipeline creates a slice through the center of the volume
  # to show the evolution of the internal structures.
  - type: "slice"
    enabled: "true"
    frequency: 1
    attributes:
      # Slice through the centre of the domain. Coordinates follow the shared mesh
      # (docs/in-situ-backends.md): spacing 0.1, so L = 64 spans 0 to 6.4. The
      # slice sits at 3.25, between grid planes: a slice exactly on a plane two
      # ranks share (3.2 here) is drawn by both.
      origin: [3.25, 3.25, 3.25]
      # The normal vector points along the X-axis, creating a YZ plane
      normal: [1, 0, 0]
    outputs:
      # Render the slice to a PNG file.
      - type: "render"
        enabled: true
        file_pattern: "extracts/kombyne_slice_v_ts_%ts.png"
        file_format: "png"
        attributes:
          width: 2113
          height: 1338
          scene:
            camera:
              position: [15.4, 15.4, 15.4]
              focus: [3.2, 3.2, 3.2]
              up: [0, 1, 0]
              fov: 30.0
            lights:
              - type: ambient
                intensity: 0.7
              - type: directional
                direction: [-1, -1, -1]
                intensity: 0.8
            pseudocolor:
              variable: "V"
              # Fixed range: by default Kombyne colours with the current data range,
              # which differs between rank counts and steps.
              minimum: 0.0
              maximum: 0.45
              color_table: "cool to warm"

