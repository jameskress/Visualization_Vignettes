name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: write        # <-- needed to push badge to a branch
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Generate latest image badge
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -Eo ':[a-f0-9]{7,}' | head -n 1 | tr -d ':')
          [ -z "$TAG" ] && TAG=$(git rev-parse --short HEAD)
          mkdir -p badges
          echo '{"schemaVersion":1,"label":"docker image","message":"'"$TAG"'","color":"blue"}' > badges/docker-latest.json

      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          force_orphan: true

      - name: Prune Docker System
        if: always()  # Run this even if the build fails
        run: |
          echo "Pruning Docker images/containers to free space..."
          docker system prune -f

  paraview-test:
    name: ParaView Tests
    needs: build
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v4
      - name: Run ParaView Test Suite
        run: |
          # Create a custom Dockerfile to prepare our test environment
          cat <<EOF > Dockerfile.paraview.test
          FROM debian:12
          # Install dependencies as root
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 libgl1-mesa-glx libosmesa6 libegl1-mesa \
           && rm -rf /var/lib/apt/lists/*
          # Create a non-root user matching the host runner's user ID
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          # Switch to the non-root user for subsequent commands
          USER user
          WORKDIR /workdir
          EOF

          # Build the test image, passing the host's UID/GID as build arguments
          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t paraview-test-env -f Dockerfile.paraview.test .

          # Run the test script inside the new container.
          # It runs as the non-root 'user', so all created files will have the correct ownership.
          docker run --rm -v "$(pwd)":/workdir paraview-test-env bash -c '
            set -e
            echo "Running ParaView Tests as a non-root user"
            python3 -m venv test-venv
            source test-venv/bin/activate
            pip3 install pandas matplotlib psutil scipy
            wget -O paraview.tar.gz "https://www.paraview.org/paraview-downloads/download.php?submit=Download&version=v6.0&type=binary&os=Linux&downloadFile=ParaView-6.0.1-MPI-Linux-Python3.12-x86_64.tar.gz"
            mkdir paraview
            tar xf paraview.tar.gz -C paraview --strip-components 1
            export PARAVIEW_DIR=$PWD/paraview/bin
            export PATH="$PARAVIEW_DIR:$PATH"
            $PARAVIEW_DIR/pvbatch --version
            cd Testing
            python3 test_suite.py ../ --test_type ParaView --paraview_version 5.13.1 --non_gpu_machine
            echo "ParaView tests complete"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paraview-test-results
          path: |
            ParaView_Vignettes/*/Testing/*.json
            ParaView_Vignettes/*/Testing/*.log
            Testing/*.json

  visit-test:
    name: VisIt Tests
    needs: build
    runs-on: self-hosted
    env:
      VISIT_VER: "3.4.1" 
      VISIT_URL: "https://github.com/visit-dav/visit/releases/download/v3.4.1/visit3_4_1.linux-x86_64-ubuntu22.tar.gz"
      # FIX: Use $HOME instead of /opt so we don't need sudo
      CACHE_DIR: "$HOME/ci-cache"

    steps:
      - name: Clean workspace
        run: |
          # Nuke the workspace directory to ensure a fresh start and save space
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v4
      - name: Ensure VisIt is Cached on Host
        run: |
          # The runner interprets $HOME automatically
          mkdir -p ${{ env.CACHE_DIR }}
          
          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"
          FILEPATH="${{ env.CACHE_DIR }}/$FILENAME"

          if [ -f "$FILEPATH" ]; then
            echo "✅ Cache Hit: Found $FILENAME. Skipping download."
          else
            echo "⚠️ Cache Miss: Downloading $FILENAME..."
            # Added -L to follow redirects and -O to specify output
            curl -L --retry 5 --retry-delay 5 -o "$FILEPATH" "${{ env.VISIT_URL }}"
            echo "✅ Download complete."
          fi

      - name: Run VisIt Test Suite
        run: |
          # ... (Your existing Dockerfile creation code) ...
          cat <<EOF > Dockerfile.visit.test
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 zip unzip libgl1-mesa-glx libosmesa6 libegl1-mesa \
           && rm -rf /var/lib/apt/lists/*
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          USER user
          WORKDIR /workdir
          EOF

          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t visit-test-env -f Dockerfile.visit.test .
          
          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"

          # Run docker mounting the $HOME cache
          docker run --rm \
            -v "$(pwd)":/workdir \
            -v ${{ env.CACHE_DIR }}:/data-cache:ro \
            visit-test-env bash -c '
            set -e
            echo "Running VisIt Tests..."
            python3 -m venv test-venv
            source test-venv/bin/activate
            pip3 install pandas matplotlib psutil scipy
            
            echo "Extracting VisIt from cache..."
            cp /data-cache/'"$FILENAME"' visit.tar.gz
            
            mkdir visit
            tar xf visit.tar.gz -C visit --strip-components 1
            export VISIT_DIR=$PWD/visit/bin
            export PATH="$VISIT_DIR:$PATH"
            $VISIT_DIR/visit -version
            cd Testing
            python3 test_suite.py ../ --test_type VisIt --visit_version ${{ env.VISIT_VER }} --test_number 0
            echo "VisIt tests complete"
          '
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visit-test-results
          path: |
            VisIt_Vignettes/*/Testing/*.json
            VisIt_Vignettes/*/Testing/*.log
            Testing/*.json
