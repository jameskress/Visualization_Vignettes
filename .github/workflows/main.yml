name: CI Pipeline

# The full pipeline runs on the shared self-hosted runner, so it runs once
# per change: on pull requests, and on pushes to master (which publish the
# image). Any branch can be run by hand from the Actions tab
# (workflow_dispatch); a manual run on master builds both platforms and
# publishes like the weekly run (the way to move `latest` sooner), and on any
# other branch it builds and tests but publishes nothing.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build arm64 (always on for master; elsewhere built but not published)"
        type: boolean
        default: false
      qemu_image:
        description: "QEMU (binfmt) image for the arm64 build, to try another than the pinned one"
        type: string
        default: ""
  schedule:
    - cron: '0 20 * * 5'   # Fridays 20:00 UTC, the KAUST weekend

# A newer push to the same pull request replaces the run still in progress.
# The event name keeps manual runs apart from master pushes: GitHub replaces
# a pending run with a newer one in the same group, and a manual run (often
# on another branch) must never displace a pending master push.
# Master pushes run one at a time and are never cancelled. If several land
# while one is running, only the newest waits; the ones in between are
# skipped on purpose (one shared runner), and the newest is compared with the
# last master commit that had a successful run, so their changes still count.
# The "newest" check below keeps an older commit from moving `latest` or the
# badge after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token by default; the build job widens it to publish.
permissions:
  contents: read

# What runs (#69). The "changes" job compares a pull request with its base,
# or a master push with the last master commit that had a successful run,
# and decides:
#   * docs only (Markdown, docs/ folders, LICENSE): nothing else runs;
#   * Miniapps/gray-scott/ only: the ParaView and VisIt suites are skipped
#     (they test the vignettes with their own downloads, not the miniapp);
#   * otherwise the image build and every suite run.
# The image build compiles the Gray-Scott miniapp with every backend. arm64
# runs under emulation and takes hours, so it is built only on the weekly
# run, on manual runs on master, and on master pushes that change the image
# recipe (Dockerfile, Scripts/docker/, this workflow). Other master pushes
# build amd64 and publish only their commit's tag; `latest`, the `master`
# tag and the badge move only with a two-platform build, so they never lose
# arm64. Pull requests build amd64 and publish nothing. A diff that cannot be
# computed runs everything.
jobs:
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest   # a git diff only; keeps it off the shared runner
    permissions:
      contents: read
      actions: read          # to find the last successful master run
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
      vignettes: ${{ steps.diff.outputs.vignettes }}
      arm64: ${{ steps.diff.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARM64_INPUT: ${{ inputs.arm64 }}
        run: |
          everything() {
            echo "$1: run everything"
            { echo "code=true"; echo "vignettes=true"; } >> "$GITHUB_OUTPUT"
            # arm64 on master; elsewhere only when a manual run asks for it
            # (built, not published), to try the emulated build.
            if { [ "$EVENT" != "pull_request" ] && [ "$REF" = "refs/heads/master" ]; } || [ "$ARM64_INPUT" = "true" ]; then
              echo "arm64=true" >> "$GITHUB_OUTPUT"
            else
              echo "arm64=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;  # three-dot: only the PR's own changes
            push)
              # Against the last master commit with a successful run, not
              # the commit before: a newer push replaces a pending one, so
              # the commits in between may never have had a run of their own.
              LAST=$(gh api "repos/$REPO/actions/workflows/main.yml/runs?branch=master&status=success&per_page=20" \
                       --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule")][0].head_sha // empty') \
                || everything "cannot list earlier runs"
              [ -n "$LAST" ] || everything "no earlier successful master run"
              git cat-file -e "$LAST^{commit}" 2>/dev/null || everything "last successful run's commit $LAST not found"
              git merge-base --is-ancestor "$LAST" "$SHA" || everything "$LAST is not an ancestor of $SHA"
              echo "last successful master run: $LAST"
              RANGE="$LAST..$SHA" ;;
            *) everything "$EVENT" ;;
          esac
          # --no-renames lists both paths of a move, so a file moved into a
          # skipped area from elsewhere still counts as outside it.
          if ! changed=$(git diff --name-only --no-renames "$RANGE"); then
            everything "cannot diff $RANGE"
          fi
          [ -n "$changed" ] || everything "empty diff"
          echo "$changed"
          docs_re='(\.md$|(^|/)docs/|^LICENSE$)'
          if ! echo "$changed" | grep -Evq "$docs_re"; then
            echo "documentation only: skip the image build and every suite"
            { echo "code=false"; echo "vignettes=false"; echo "arm64=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"
          if ! echo "$changed" | grep -Ev "$docs_re" | grep -qv '^Miniapps/gray-scott/'; then
            echo "only Miniapps/gray-scott/ (and docs) changed: skip the ParaView and VisIt suites"
            echo "vignettes=false" >> "$GITHUB_OUTPUT"
          else
            echo "vignettes=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" = "push" ] && echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|Scripts/docker/|\.github/workflows/main\.yml)'; then
            echo "the image recipe changed: build arm64 too"
            echo "arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "arm64=false" >> "$GITHUB_OUTPUT"
          fi

  # The image is built in two jobs, so an arm64 failure (arm64 runs under
  # QEMU emulation, which has crashed in apt's libc-bin step: 2026-11-16) can
  # never stop the amd64 image or the tests:
  #   build        amd64, every run that changes code; no emulation;
  #   build-arm64  arm64, only when "changes" asks for it (weekly, recipe
  #                changes, manual runs), with a pinned QEMU image;
  #   publish      on a GitHub-hosted runner, joins the two into one
  #                multi-platform tag and moves `latest`, `master` and the badge.
  # Published tags: <sha>-amd64 and <sha>-arm64 per platform, and <sha> for
  # the commit (both platforms when arm64 built, amd64 alone otherwise).
  build:
    name: Build and Push Docker Image
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: self-hosted
    # An amd64 build with the cache takes minutes; from an empty cache it
    # rebuilds ParaView and the rest (hours). The limit stops a hung build
    # from holding the shared runner (a master build sat 7 hours on
    # 2026-11-16 under the old 24-hour limit).
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      publish: ${{ steps.tip.outputs.publish }}
      short_sha: ${{ steps.tip.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      # A pull request reads the cache but writes it only when there is
      # none, so master's cache is never replaced by a pull request's.
      - name: Choose the cache
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          C: /tmp/.buildx-cache-amd64
        run: |
          # A cache left by an interrupted run must never be rotated in.
          rm -rf "$C-new"
          HAVE_CACHE=false
          [ -f "$C/index.json" ] && HAVE_CACHE=true
          if [ "$EVENT" = "pull_request" ] && [ "$HAVE_CACHE" = true ]; then WRITE=false; else WRITE=true; fi
          echo "cache present: $HAVE_CACHE, write cache: $WRITE"
          echo "write_cache=$WRITE" >> "$GITHUB_OUTPUT"
          if [ "$WRITE" = true ]; then
            echo "cache_to=type=local,dest=$C-new,mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          fi
      # Master pushes, the weekly run and manual runs on master publish.
      - name: Decide what to publish
        id: tip
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ARM64: ${{ needs.changes.outputs.arm64 }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          PUBLISH=false
          case "$EVENT" in push | schedule | workflow_dispatch)
            [ "$REF" = "refs/heads/master" ] && PUBLISH=true ;;
          esac
          SHORT=$(git rev-parse --short=7 HEAD)
          # Without arm64 this image is the commit's tag; with it, the
          # publish job makes <sha> from both platforms.
          TAGS="$IMAGE:$SHORT-amd64"
          [ "$ARM64" = true ] || TAGS="$TAGS,$IMAGE:$SHORT"
          IMAGE_LC=$(echo "$TAGS" | tr '[:upper:]' '[:lower:]')
          echo "publish=$PUBLISH, tags=$IMAGE_LC"
          { echo "publish=$PUBLISH"; echo "short_sha=$SHORT"; echo "tags=$IMAGE_LC"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # z2n-fe is also the SAGE server (kvl/kvl-windows-management#243): the builder
      # gets at most 48 of the 64 threads, and a tenth of SAGE's share when both are busy.
      # (buildx on z2n-fe is v0.10.5, older than the driver's CPU options, hence
      # docker update on the builder container.)
      - name: Cap the builder's CPU
        run: docker update --cpus 48 --cpu-shares 256 "buildx_buildkit_${{ steps.buildx.outputs.name }}0"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.tip.outputs.publish == 'true' }}
          tags: ${{ steps.tip.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The per-platform cache, and the old two-platform one it replaces
          # (read only, so the first build after the split starts warm).
          cache-from: |
            type=local,src=/tmp/.buildx-cache-amd64
            type=local,src=/tmp/.buildx-cache
          # Writes to a NEW directory, rotated in by the step below. Writing
          # back to the directory it reads from makes buildx append rather
          # than replace, and with mode=max that grows without bound on a
          # self-hosted runner, where /tmp survives every run. A full disk
          # then shows up as a truncated download and a bare `tar` exit 2 in
          # the test jobs, naming nothing.
          cache-to: ${{ steps.plan.outputs.cache_to }}
      # Swap in the new cache only after a successful build that wrote a
      # complete one (index.json last). A cancelled or failed run used to
      # rotate a partial directory in, and the next build started from
      # nothing (4 hours on 2026-11-08).
      - name: Rotate the buildx cache
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WROTE_CACHE: ${{ steps.plan.outputs.write_cache }}
          C: /tmp/.buildx-cache-amd64
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$WROTE_CACHE" = "true" ] && [ -f "$C-new/index.json" ]; then
            rm -rf "$C"
            mv "$C-new" "$C"
            echo "cache rotated"
          else
            rm -rf "$C-new"
            echo "build $BUILD_OUTCOME, cache written: $WROTE_CACHE; kept the existing cache"
          fi
          echo "buildx cache: $(du -sh "$C" 2>/dev/null | cut -f1)"
          df -h /tmp /home 2>/dev/null || df -h
      - name: Prune Docker System
        if: always()  # Run this even if the build fails
        run: |
          echo "Pruning Docker images/containers to free space..."
          docker system prune -f

  build-arm64:
    name: Build arm64 image (emulated)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.arm64 == 'true' }}
    runs-on: self-hosted
    # Emulated, from an empty cache, rebuilds ParaView and the rest under
    # QEMU (many hours). A failure here leaves the amd64 image published.
    timeout-minutes: 600
    permissions:
      contents: read
      packages: write
    env:
      # QEMU user-mode emulation segfaulted in libc-bin's postinst
      # (ldconfig) with tonistiigi/binfmt:latest (QEMU 10.2.3) on
      # 2026-11-16. Pinned so an upstream change cannot break the build
      # unannounced; a manual run can try another (input qemu_image).
      QEMU_IMAGE: ${{ inputs.qemu_image || 'docker.io/tonistiigi/binfmt:qemu-v10.2.3-68' }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose the cache
        id: plan
        env:
          C: /tmp/.buildx-cache-arm64
        run: |
          rm -rf "$C-new"
          echo "cache present: $([ -f "$C/index.json" ] && echo true || echo false)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Cap the builder's CPU
        run: docker update --cpus 48 --cpu-shares 256 "buildx_buildkit_${{ steps.buildx.outputs.name }}0"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Tag
        id: tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHORT: ${{ needs.build.outputs.short_sha }}
        run: echo "tags=$(echo "$IMAGE:$SHORT-arm64" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: ${{ needs.build.outputs.publish == 'true' }}
          tags: ${{ steps.tag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache-arm64
            type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-arm64-new,mode=max
      - name: Rotate the buildx cache
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          C: /tmp/.buildx-cache-arm64
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ -f "$C-new/index.json" ]; then
            rm -rf "$C"
            mv "$C-new" "$C"
            echo "cache rotated"
          else
            rm -rf "$C-new"
            echo "build $BUILD_OUTCOME; kept the existing cache"
          fi
          echo "buildx cache: $(du -sh "$C" 2>/dev/null | cut -f1)"
      - name: Prune Docker System
        if: always()
        run: docker system prune -f

  publish:
    name: Publish image tags and badge
    needs: [changes, build, build-arm64]
    # After the arm64 job whatever its outcome (or when it was skipped), as
    # long as the amd64 image was built and published with arm64 planned.
    if: ${{ always() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' && needs.changes.outputs.arm64 == 'true' }}
    runs-on: ubuntu-latest   # registry calls only; keeps it off the shared runner
    timeout-minutes: 15
    permissions:
      contents: write        # the badge on gh-pages
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest`, `master` and the badge move only from master's current tip,
      # so a run for an older commit can never overwrite a newer one's, and
      # only when both platforms built, so they never lose arm64.
      - name: Join the platforms and tag
        id: join
        env:
          ARM64_RESULT: ${{ needs.build-arm64.result }}
          SHORT: ${{ needs.build.outputs.short_sha }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$(echo "ghcr.io/$REPO" | tr '[:upper:]' '[:lower:]')
          TIP=$(git ls-remote origin refs/heads/master | cut -f1)
          NEWEST=false
          if [ "$ARM64_RESULT" = success ]; then
            TAGS=(-t "$IMAGE:$SHORT")
            if [ "$TIP" = "$SHA" ]; then
              NEWEST=true
              TAGS+=(-t "$IMAGE:master" -t "$IMAGE:latest")
            fi
            docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$SHORT-amd64" "$IMAGE:$SHORT-arm64"
          else
            echo "::warning::arm64 build $ARM64_RESULT: $IMAGE:$SHORT is amd64 only, and latest stays where it was"
            docker buildx imagetools create -t "$IMAGE:$SHORT" "$IMAGE:$SHORT-amd64"
          fi
          echo "master tip $TIP, this run $SHA, newest=$NEWEST"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
      - name: Generate latest image badge
        if: ${{ steps.join.outputs.newest == 'true' }}
        env:
          SHORT: ${{ needs.build.outputs.short_sha }}
        run: |
          mkdir -p badges
          echo '{"schemaVersion":1,"label":"docker image","message":"'"$SHORT"'","color":"blue"}' > badges/docker-latest.json
      - name: Publish badge to GitHub Pages
        id: badge
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ steps.join.outputs.newest == 'true' }}
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          # Keep the rest of gh-pages: the results dashboard lives in
          # dashboard/ (dashboard.yml). force_orphan replaced the whole
          # branch with the badge and deleted it on every master push.
          keep_files: true
      # dashboard.yml pushes to the same branch and the action neither
      # rebases nor retries, so a push that lands in between is rejected.
      # Try once more from the new tip.
      - name: Publish badge again if the branch moved
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ steps.join.outputs.newest == 'true' && steps.badge.outcome == 'failure' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          keep_files: true

  # TEMPORARY (remove before merge): which QEMU image survives the step that
  # crashed on 2026-11-16 (libc-bin's postinst, ldconfig, under arm64
  # emulation of ubuntu:22.04). One image at a time: binfmt is host-wide.
  qemu-probe:
    name: QEMU probe
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - docker.io/tonistiigi/binfmt:qemu-v10.2.3-68
          - docker.io/tonistiigi/binfmt:qemu-v9.2.2-52
          - docker.io/tonistiigi/binfmt:qemu-v8.1.5-43
          - docker.io/tonistiigi/binfmt:qemu-v7.0.0-28
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ${{ matrix.image }}
          platforms: arm64
      - name: apt-get with libc-bin under arm64 emulation
        run: |
          docker run --rm --platform linux/arm64 ubuntu:22.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --reinstall libc-bin >/dev/null
            apt-get install -y -qq build-essential cmake git libopenmpi-dev python3-dev >/dev/null
            ldconfig
            echo "PROBE OK: $(uname -m), $(ldd --version | head -1)"'

  gray-scott-test:
    name: Gray-Scott Miniapp Tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Independent of the image build: it needs only the source tree. Capped at
    # 4 CPUs (docker --cpus) because the self-hosted runner has no CPU limit
    # of its own yet; the work is a 64^3 problem on at most 4 ranks.
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
        with:
          # The container runs PR code; leave no token in .git/config for it.
          persist-credentials: false
      - name: Build the host-cpu preset and run ctest
        run: |
          # The job body is a file; see the header of
          # .github/scripts/ci_gray_scott.sh for how to run it locally.
          docker build \
            --build-arg USER_ID="$(id -u)" \
            --build-arg GROUP_ID="$(id -g)" \
            -t gray-scott-test-env -f .github/docker/Dockerfile.gray-scott.test .github/docker
          docker run --rm --cpus=4 -v "$(pwd)":/workdir gray-scott-test-env \
            bash /workdir/.github/scripts/ci_gray_scott.sh
      # The build tree is written by PR code in the container, which could
      # replace the log with a symlink to a file on the runner. Upload a copy,
      # made only if the log and every directory above it in the build tree
      # are real files and directories.
      - name: Stage the test log
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/gray-scott-log"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          p=Miniapps/gray-scott/build/host-cpu/Testing/Temporary/LastTest.log
          d=$p
          while [ "$d" != "." ] && [ "$d" != "/" ]; do
            if [ -L "$d" ]; then echo "::warning::$d is a symlink; not uploading the log"; exit 0; fi
            d=$(dirname "$d")
          done
          if [ -f "$p" ]; then cp -- "$p" "$STAGE/LastTest.log"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gray-scott-test-results
          path: ${{ runner.temp }}/gray-scott-log/LastTest.log
          if-no-files-found: warn

  paraview-test:
    name: ParaView Tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.vignettes == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
      - name: Run ParaView Test Suite
        run: |
          # Create a custom Dockerfile to prepare our test environment
          cat <<EOF > Dockerfile.paraview.test
          FROM debian:12
          # Install dependencies as root
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 libgl1-mesa-glx libosmesa6 libegl1-mesa \
              xvfb \
           && rm -rf /var/lib/apt/lists/*
          # Create a non-root user matching the host runner's user ID
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          # Switch to the non-root user for subsequent commands
          USER user
          WORKDIR /workdir
          EOF

          # Build the test image, passing the host's UID/GID as build arguments
          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t paraview-test-env -f Dockerfile.paraview.test .

          # Keep the 826 MB ParaView tarball on the runner between runs, the
          # way the VisIt job does: paraview.org dropped a download mid-stream
          # on 27 Oct 2026 and the retry's TLS handshake was refused, which
          # failed the job for nothing in this repository. On a miss the
          # download happens here, with resume and retries, and is verified
          # by size before it is kept.
          CACHE_DIR="$HOME/ci-cache"; mkdir -p "$CACHE_DIR"
          PV_TARBALL="ParaView-6.2.0-MPI-Linux-Python3.12-x86_64.tar.gz"
          if [ -f "$CACHE_DIR/$PV_TARBALL" ] && [ "$(stat -c%s "$CACHE_DIR/$PV_TARBALL")" -gt 100000000 ]; then
            echo "Cache hit: $PV_TARBALL"
          else
            echo "Cache miss: downloading $PV_TARBALL"
            wget --continue --tries=5 --waitretry=20 --retry-connrefused -O "$CACHE_DIR/$PV_TARBALL.part" \
              "https://www.paraview.org/paraview-downloads/download.php?submit=Download&version=v6.2&type=binary&os=Linux&downloadFile=$PV_TARBALL"
            [ "$(stat -c%s "$CACHE_DIR/$PV_TARBALL.part")" -gt 100000000 ] && mv "$CACHE_DIR/$PV_TARBALL.part" "$CACHE_DIR/$PV_TARBALL"
          fi
          ls -la "$CACHE_DIR"

          # The job body is a file, not an inline payload. See the header
          # of .github/scripts/ci_paraview.sh for why, and for how to run
          # exactly this locally.
          # --cpus/--cpu-shares: z2n-fe is shared with SAGE (#73).
          docker run --rm --cpus 48 --cpu-shares 256 -v "$(pwd)":/workdir -v "$CACHE_DIR":/data-cache:ro \
            -e PARAVIEW_TARBALL="$PV_TARBALL" paraview-test-env \
            bash /workdir/.github/scripts/ci_paraview.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paraview-test-results
          path: |
            ParaView_Vignettes/*/Testing/*.json
            ParaView_Vignettes/*/Testing/*.log
            Testing/*.json

  visit-test:
    name: VisIt Tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.vignettes == 'true' }}
    runs-on: self-hosted
    env:
      # The shared VisIt baselines are blessed with 3.5.0 (12 Nov 2026), so
      # CI runs the same release; it renders them within tolerance.
      VISIT_VER: "3.5.0"
      VISIT_URL: "https://github.com/visit-dav/visit/releases/download/v3.5.0/visit3_5_0.linux-x86_64-ubuntu22.tar.gz"
      # FIX: Use $HOME instead of /opt so we don't need sudo
      CACHE_DIR: "$HOME/ci-cache"

    steps:
      - name: Clean workspace
        run: |
          # Nuke the workspace directory to ensure a fresh start and save space
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
      - name: Ensure VisIt is Cached on Host
        run: |
          # The runner interprets $HOME automatically
          mkdir -p ${{ env.CACHE_DIR }}

          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"
          FILEPATH="${{ env.CACHE_DIR }}/$FILENAME"

          if [ -f "$FILEPATH" ]; then
            echo "✅ Cache Hit: Found $FILENAME. Skipping download."
          else
            echo "⚠️ Cache Miss: Downloading $FILENAME..."
            # Into a temporary file, moved into the cache only once complete:
            # the cache-hit test above accepts any file at FILEPATH, so an
            # interrupted download left there would be reused truncated by
            # every later run. -f makes an HTTP error fail instead of saving
            # the error page as the archive.
            rm -f "$FILEPATH.part"
            curl -fL --retry 5 --retry-delay 5 -o "$FILEPATH.part" "${{ env.VISIT_URL }}"
            mv "$FILEPATH.part" "$FILEPATH"
            echo "✅ Download complete."
          fi

      - name: Run VisIt Test Suite
        run: |
          # ... (Your existing Dockerfile creation code) ...
          cat <<EOF > Dockerfile.visit.test
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 zip unzip libgl1-mesa-glx libosmesa6 libegl1-mesa \
              xvfb \
           && rm -rf /var/lib/apt/lists/*
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          USER user
          WORKDIR /workdir
          EOF

          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t visit-test-env -f Dockerfile.visit.test .

          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"

          # Run docker mounting the $HOME cache. --cpus/--cpu-shares: z2n-fe is
          # shared with SAGE (#73).
          docker run --rm --cpus 48 --cpu-shares 256 \
            -v "$(pwd)":/workdir \
            -v ${{ env.CACHE_DIR }}:/data-cache:ro \
            -e VISIT_VERSION=${{ env.VISIT_VER }} \
            -e VISIT_TARBALL="$FILENAME" \
            visit-test-env bash /workdir/.github/scripts/ci_visit.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visit-test-results
          path: |
            VisIt_Vignettes/*/Testing/*.json
            VisIt_Vignettes/*/Testing/*.log
            Testing/*.json
