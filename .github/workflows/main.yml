name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: write        # <-- needed to push badge to a branch
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      # REMOVED: docker/setup-buildx-action (Causes 100s timeout)
      # REMOVED: docker/metadata-action (Simplifying to native commands)

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Native)
        run: |
          # 1. Convert repository name to lowercase (Docker requirement)
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          # 2. Build the image
          echo "Building $IMAGE_ID:latest..."
          docker build -t $IMAGE_ID:latest .
          
          # 3. Push the image
          # Only push if this is NOT a pull request
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker push $IMAGE_ID:latest
          fi

      - name: Generate latest image badge
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # Use git hash since we aren't using metadata-action anymore
          TAG=$(git rev-parse --short HEAD)
          mkdir -p badges
          echo '{"schemaVersion":1,"label":"docker image","message":"'"$TAG"'","color":"blue"}' > badges/docker-latest.json

      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          force_orphan: true

  paraview-test:
    name: ParaView Tests
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run ParaView Test Suite
        run: |
          # Create a custom Dockerfile to prepare our test environment
          cat <<EOF > Dockerfile.paraview.test
          FROM debian:12
          # Install dependencies as root
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 libgl1-mesa-glx libosmesa6 libegl1-mesa \
           && rm -rf /var/lib/apt/lists/*
          # Create a non-root user matching the host runner's user ID
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          # Switch to the non-root user for subsequent commands
          USER user
          WORKDIR /workdir
          EOF

          # Build the test image, passing the host's UID/GID as build arguments
          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t paraview-test-env -f Dockerfile.paraview.test .

          # Run the test script inside the new container.
          # ADDED: --sysctl to fix network timeouts
          docker run --rm \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            -v "$(pwd)":/workdir \
            paraview-test-env bash -c '
            set -e
            echo "Running ParaView Tests as a non-root user"
            python3 -m venv test-venv
            source test-venv/bin/activate
            pip3 install pandas matplotlib psutil scipy
            wget -O paraview.tar.gz "https://www.paraview.org/paraview-downloads/download.php?submit=Download&version=v6.0&type=binary&os=Linux&downloadFile=ParaView-6.0.1-MPI-Linux-Python3.12-x86_64.tar.gz"
            mkdir paraview
            tar xf paraview.tar.gz -C paraview --strip-components 1
            export PARAVIEW_DIR=$PWD/paraview/bin
            export PATH="$PARAVIEW_DIR:$PATH"
            $PARAVIEW_DIR/pvbatch --version
            cd Testing
            python3 test_suite.py ../ --test_type ParaView --paraview_version 5.13.1 --non_gpu_machine
            echo "ParaView tests complete"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paraview-test-results
          path: |
            ParaView_Vignettes/*/Testing/*.json
            ParaView_Vignettes/*/Testing/*.log
            Testing/*.json

  visit-test:
    name: VisIt Tests
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run VisIt Test Suite
        run: |
          # Create a custom Dockerfile for the VisIt test environment
          cat <<EOF > Dockerfile.visit.test
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 curl zip unzip libgl1-mesa-glx libosmesa6 libegl1-mesa \
           && rm -rf /var/lib/apt/lists/*
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          USER user
          WORKDIR /workdir
          EOF

          # Build the VisIt test image
          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t visit-test-env -f Dockerfile.visit.test .
          
          # Run the test script inside the new container
          # ADDED: --sysctl to fix network timeouts
          docker run --rm \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            -v "$(pwd)":/workdir \
            visit-test-env bash -c '
            set -e
            echo "Running VisIt Tests as a non-root user"
            python3 -m venv test-venv
            source test-venv/bin/activate
            pip3 install pandas matplotlib psutil scipy
            wget -O visit.tar.gz "https://github.com/visit-dav/visit/releases/download/v3.4.1/visit3_4_1.linux-x86_64-ubuntu22.tar.gz"
            mkdir visit
            tar xf visit.tar.gz -C visit --strip-components 1
            export VISIT_DIR=$PWD/visit/bin
            export PATH="$VISIT_DIR:$PATH"
            $VISIT_DIR/visit -version
            cd Testing
            python3 test_suite.py ../ --test_type VisIt --visit_version 3.4.1 --test_number 0
            echo "VisIt tests complete"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visit-test-results
          path: |
            VisIt_Vignettes/*/Testing/*.json
            VisIt_Vignettes/*/Testing/*.log
            Testing/*.json
