name: CI Pipeline

# The full pipeline runs on the shared self-hosted runner, so it runs once
# per change: on pull requests, and on pushes to master (which publish the
# image and the badge). Any other branch can be run by hand from the Actions
# tab (workflow_dispatch); such runs build and test but publish nothing.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

# A newer push to the same pull request replaces the run still in progress.
# The event name keeps manual runs apart from master pushes: GitHub replaces
# a pending run with a newer one in the same group, and a manual run does not
# publish, so it must never displace a pending master push.
# Master pushes run one at a time and are never cancelled. If several land
# while one is running, only the newest waits; the ones in between are
# skipped on purpose (one shared runner). The "newest" check below keeps an
# older commit from moving `latest` or the badge after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token by default; the build job widens it to publish.
permissions:
  contents: read

# What a pull request runs (#69). The image build always runs, because the
# image compiles the Gray-Scott miniapp with every backend; on pull requests
# it builds amd64 only (arm64 runs under emulation and takes hours) and
# publishes nothing. The ParaView and VisIt suites test the vignettes with
# their own downloads, not the miniapp, so a pull request that changes only
# Miniapps/gray-scott/ skips them. Pushes to master and manual runs always run
# everything.
jobs:
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest   # a git diff only; keeps it off the shared runner
    timeout-minutes: 10
    outputs:
      vignettes: ${{ steps.diff.outputs.vignettes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the pull request's base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request: run everything"
            echo "vignettes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot: only what the pull request itself changes.
          # --no-renames lists both paths of a move, so a file moved into
          # Miniapps/gray-scott/ from elsewhere still counts as outside.
          if ! changed=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            echo "cannot diff $BASE...$HEAD: run everything"
            echo "vignettes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^Miniapps/gray-scott/'; then
            echo "only Miniapps/gray-scott/ changed: skip the ParaView and VisIt suites"
            echo "vignettes=false" >> "$GITHUB_OUTPUT"
          else
            echo "vignettes=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and Push Docker Image
    runs-on: self-hosted
    timeout-minutes: 1440
    permissions:
      contents: write        # <-- needed to push badge to a branch
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A pull request reads the cache but writes it only when there is
      # none; otherwise its amd64-only cache would replace master's
      # two-platform one and the next master build would redo arm64.
      - name: Choose platforms and cache
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A cache left by an interrupted run must never be rotated in.
          rm -rf /tmp/.buildx-cache-new
          HAVE_CACHE=false
          [ -f /tmp/.buildx-cache/index.json ] && HAVE_CACHE=true
          if [ "$EVENT" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            if [ "$HAVE_CACHE" = true ]; then WRITE=false; else WRITE=true; fi
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            WRITE=true
          fi
          echo "cache present: $HAVE_CACHE, write cache: $WRITE"
          echo "write_cache=$WRITE" >> "$GITHUB_OUTPUT"
          if [ "$WRITE" = true ]; then
            echo "cache_to=type=local,dest=/tmp/.buildx-cache-new,mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          fi
      # Publish `latest` and the badge only from master's current tip, so a
      # run for an older commit can never overwrite a newer one's.
      - name: Check this commit is master's tip
        id: tip
        run: |
          TIP=$(git ls-remote origin refs/heads/master | cut -f1)
          NEWEST=false
          if [ "${{ github.event_name }}" = "push" ] && [ "$TIP" = "${{ github.sha }}" ]; then NEWEST=true; fi
          echo "master tip $TIP, this run ${{ github.sha }}, newest=$NEWEST"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # z2n-fe is also the SAGE server (kvl/kvl-windows-management#243): the builder
      # gets at most 48 of the 64 threads, and a tenth of SAGE's share when both are busy.
      # (buildx on z2n-fe is v0.10.5, older than the driver's CPU options, hence
      # docker update on the builder container.)
      - name: Cap the builder's CPU
        run: docker update --cpus 48 --cpu-shares 256 "buildx_buildkit_${{ steps.buildx.outputs.name }}0"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.tip.outputs.newest == 'true' }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          # Writes to a NEW directory, rotated in by the step below. Writing
          # back to the directory it reads from makes buildx append rather
          # than replace, and with mode=max across two platforms that grows
          # without bound on a self-hosted runner, where /tmp survives every
          # run. A full disk then shows up as a truncated download and a bare
          # `tar` exit 2 in the test jobs, naming nothing.
          cache-to: ${{ steps.plan.outputs.cache_to }}

      # Swap in the new cache only after a successful build that wrote a
      # complete one (index.json last). A cancelled or failed run used to
      # rotate a partial directory in, and the next build started from
      # nothing (4 hours on 2026-11-08).
      - name: Rotate the buildx cache
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WROTE_CACHE: ${{ steps.plan.outputs.write_cache }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$WROTE_CACHE" = "true" ] && [ -f /tmp/.buildx-cache-new/index.json ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
            echo "cache rotated"
          else
            rm -rf /tmp/.buildx-cache-new
            echo "build $BUILD_OUTCOME, cache written: $WROTE_CACHE; kept the existing cache"
          fi
          echo "buildx cache: $(du -sh /tmp/.buildx-cache 2>/dev/null | cut -f1)"
          df -h /tmp /home 2>/dev/null || df -h

      - name: Generate latest image badge
        if: ${{ steps.tip.outputs.newest == 'true' }}
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -Eo ':[a-f0-9]{7,}' | head -n 1 | tr -d ':')
          [ -z "$TAG" ] && TAG=$(git rev-parse --short HEAD)
          mkdir -p badges
          echo '{"schemaVersion":1,"label":"docker image","message":"'"$TAG"'","color":"blue"}' > badges/docker-latest.json

      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ steps.tip.outputs.newest == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          force_orphan: true

      - name: Prune Docker System
        if: always()  # Run this even if the build fails
        run: |
          echo "Pruning Docker images/containers to free space..."
          docker system prune -f

  gray-scott-test:
    name: Gray-Scott Miniapp Tests
    # Independent of the image build: it needs only the source tree. Capped at
    # 4 CPUs (docker --cpus) because the self-hosted runner has no CPU limit
    # of its own yet; the work is a 64^3 problem on at most 4 ranks.
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
        with:
          # The container runs PR code; leave no token in .git/config for it.
          persist-credentials: false
      - name: Build the host-cpu preset and run ctest
        run: |
          # The job body is a file; see the header of
          # .github/scripts/ci_gray_scott.sh for how to run it locally.
          docker build \
            --build-arg USER_ID="$(id -u)" \
            --build-arg GROUP_ID="$(id -g)" \
            -t gray-scott-test-env -f .github/docker/Dockerfile.gray-scott.test .github/docker
          docker run --rm --cpus=4 -v "$(pwd)":/workdir gray-scott-test-env \
            bash /workdir/.github/scripts/ci_gray_scott.sh
      # The build tree is written by PR code in the container, which could
      # replace the log with a symlink to a file on the runner. Upload a copy,
      # made only if the log and every directory above it in the build tree
      # are real files and directories.
      - name: Stage the test log
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/gray-scott-log"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          p=Miniapps/gray-scott/build/host-cpu/Testing/Temporary/LastTest.log
          d=$p
          while [ "$d" != "." ] && [ "$d" != "/" ]; do
            if [ -L "$d" ]; then echo "::warning::$d is a symlink; not uploading the log"; exit 0; fi
            d=$(dirname "$d")
          done
          if [ -f "$p" ]; then cp -- "$p" "$STAGE/LastTest.log"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gray-scott-test-results
          path: ${{ runner.temp }}/gray-scott-log/LastTest.log
          if-no-files-found: warn

  paraview-test:
    name: ParaView Tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.vignettes == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
      - name: Run ParaView Test Suite
        run: |
          # Create a custom Dockerfile to prepare our test environment
          cat <<EOF > Dockerfile.paraview.test
          FROM debian:12
          # Install dependencies as root
          RUN apt-get update && apt-get install -y --no-install-recommends \
              wget make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 libgl1-mesa-glx libosmesa6 libegl1-mesa \
              xvfb \
           && rm -rf /var/lib/apt/lists/*
          # Create a non-root user matching the host runner's user ID
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          # Switch to the non-root user for subsequent commands
          USER user
          WORKDIR /workdir
          EOF

          # Build the test image, passing the host's UID/GID as build arguments
          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t paraview-test-env -f Dockerfile.paraview.test .

          # Keep the 826 MB ParaView tarball on the runner between runs, the
          # way the VisIt job does: paraview.org dropped a download mid-stream
          # on 27 Oct 2026 and the retry's TLS handshake was refused, which
          # failed the job for nothing in this repository. On a miss the
          # download happens here, with resume and retries, and is verified
          # by size before it is kept.
          CACHE_DIR="$HOME/ci-cache"; mkdir -p "$CACHE_DIR"
          PV_TARBALL="ParaView-6.2.0-MPI-Linux-Python3.12-x86_64.tar.gz"
          if [ -f "$CACHE_DIR/$PV_TARBALL" ] && [ "$(stat -c%s "$CACHE_DIR/$PV_TARBALL")" -gt 100000000 ]; then
            echo "Cache hit: $PV_TARBALL"
          else
            echo "Cache miss: downloading $PV_TARBALL"
            wget --continue --tries=5 --waitretry=20 --retry-connrefused -O "$CACHE_DIR/$PV_TARBALL.part" \
              "https://www.paraview.org/paraview-downloads/download.php?submit=Download&version=v6.2&type=binary&os=Linux&downloadFile=$PV_TARBALL"
            [ "$(stat -c%s "$CACHE_DIR/$PV_TARBALL.part")" -gt 100000000 ] && mv "$CACHE_DIR/$PV_TARBALL.part" "$CACHE_DIR/$PV_TARBALL"
          fi
          ls -la "$CACHE_DIR"

          # The job body is a file, not an inline payload. See the header
          # of .github/scripts/ci_paraview.sh for why, and for how to run
          # exactly this locally.
          # --cpus/--cpu-shares: z2n-fe is shared with SAGE (#73).
          docker run --rm --cpus 48 --cpu-shares 256 -v "$(pwd)":/workdir -v "$CACHE_DIR":/data-cache:ro \
            -e PARAVIEW_TARBALL="$PV_TARBALL" paraview-test-env \
            bash /workdir/.github/scripts/ci_paraview.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paraview-test-results
          path: |
            ParaView_Vignettes/*/Testing/*.json
            ParaView_Vignettes/*/Testing/*.log
            Testing/*.json

  visit-test:
    name: VisIt Tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.vignettes == 'true' }}
    runs-on: self-hosted
    env:
      # The shared VisIt baselines are blessed with 3.5.0 (12 Nov 2026), so
      # CI runs the same release; it renders them within tolerance.
      VISIT_VER: "3.5.0"
      VISIT_URL: "https://github.com/visit-dav/visit/releases/download/v3.5.0/visit3_5_0.linux-x86_64-ubuntu22.tar.gz"
      # FIX: Use $HOME instead of /opt so we don't need sudo
      CACHE_DIR: "$HOME/ci-cache"

    steps:
      - name: Clean workspace
        run: |
          # Nuke the workspace directory to ensure a fresh start and save space
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
      - uses: actions/checkout@v7
      - name: Ensure VisIt is Cached on Host
        run: |
          # The runner interprets $HOME automatically
          mkdir -p ${{ env.CACHE_DIR }}

          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"
          FILEPATH="${{ env.CACHE_DIR }}/$FILENAME"

          if [ -f "$FILEPATH" ]; then
            echo "✅ Cache Hit: Found $FILENAME. Skipping download."
          else
            echo "⚠️ Cache Miss: Downloading $FILENAME..."
            # Added -L to follow redirects and -O to specify output
            curl -L --retry 5 --retry-delay 5 -o "$FILEPATH" "${{ env.VISIT_URL }}"
            echo "✅ Download complete."
          fi

      - name: Run VisIt Test Suite
        run: |
          # ... (Your existing Dockerfile creation code) ...
          cat <<EOF > Dockerfile.visit.test
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              make autoconf gfortran libmpich-dev python3-full python3-pip \
              ffmpeg libsm6 libxext6 zip unzip libgl1-mesa-glx libosmesa6 libegl1-mesa \
              xvfb \
           && rm -rf /var/lib/apt/lists/*
          ARG USER_ID
          ARG GROUP_ID
          RUN addgroup --gid \$GROUP_ID user && \
              adduser --disabled-password --gecos '' --uid \$USER_ID --gid \$GROUP_ID user
          USER user
          WORKDIR /workdir
          EOF

          docker build \
            --build-arg USER_ID=$(id -u) \
            --build-arg GROUP_ID=$(id -g) \
            -t visit-test-env -f Dockerfile.visit.test .

          FILENAME="visit-${{ env.VISIT_VER }}.tar.gz"

          # Run docker mounting the $HOME cache. --cpus/--cpu-shares: z2n-fe is
          # shared with SAGE (#73).
          docker run --rm --cpus 48 --cpu-shares 256 \
            -v "$(pwd)":/workdir \
            -v ${{ env.CACHE_DIR }}:/data-cache:ro \
            -e VISIT_VERSION=${{ env.VISIT_VER }} \
            -e VISIT_TARBALL="$FILENAME" \
            visit-test-env bash /workdir/.github/scripts/ci_visit.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visit-test-results
          path: |
            VisIt_Vignettes/*/Testing/*.json
            VisIt_Vignettes/*/Testing/*.log
            Testing/*.json
