name: Results dashboard

# Builds the vignette results dashboard (Testing/dashboard.py) from the
# committed performance_metrics records and publishes it to GitHub Pages at
# https://jameskress.github.io/Visualization_Vignettes/dashboard/.
#
# Pages is served from the gh-pages branch, which also holds the Docker
# badge that main.yml publishes at its root. This workflow replaces only
# dashboard/, and main.yml keeps every file but its badge, so neither
# removes the other's.
#
# Runs on a GitHub-hosted runner: the generator is standard-library Python
# and puts no load on the shared self-hosted runner. A pull request builds
# the site and attaches it as an artifact to look at; only master publishes.
on:
  push:
    branches: [ master ]
    paths:
      - '**/performance_metrics_*.json'
      - 'Testing/check_submission.py'
      - 'Testing/dashboard.py'
      - 'Testing/retired_configurations.json'
      - 'ParaView_Vignettes/*/*.py'
      - 'VisIt_Vignettes/*/*.py'
      - 'Testing/drift.py'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - '**/performance_metrics_*.json'
      - 'Testing/check_submission.py'
      - 'Testing/dashboard.py'
      - 'Testing/retired_configurations.json'
      - 'ParaView_Vignettes/*/*.py'
      - 'VisIt_Vignettes/*/*.py'
      - 'Testing/drift.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

# One publish at a time; a newer master push replaces a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history: dashboard.py reads which revision of each
          # vignette every record ran from git, and compares only like runs.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # What a pull request of results must pass (Testing/ADD_YOUR_SITE.md):
      # every history file parses and carries public names, and the
      # records it adds come from a current test_suite.py. A push to
      # master has no base, so it checks the structure only.
      - name: Check the records
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            python3 Testing/check_submission.py --base "origin/$BASE"
          else
            python3 Testing/check_submission.py
          fi
      - name: Generate
        run: python3 Testing/dashboard.py --out _site/dashboard
      # The Pages root had no page (404); the site lives under dashboard/.
      # A small page there sends visitors on. Published on its own, with
      # keep_files, so the badge beside it stays.
      - name: Root page
        run: |
          mkdir -p _site/root
          cat > _site/root/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Visualization Vignettes</title>
          <meta http-equiv="refresh" content="0; url=dashboard/">
          <link rel="canonical" href="dashboard/">
          <style>body{font:16px/1.5 system-ui,sans-serif;margin:3em auto;max-width:40em;padding:0 1em}</style>
          </head><body>
          <h1>Visualization Vignettes</h1>
          <p>The regression suite's results are on the <a href="dashboard/">dashboard</a>.</p>
          </body></html>
          HTML
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: _site
          retention-days: 14

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # pushes to gh-pages
    steps:
      # A re-run of an older master run would otherwise put an older
      # dashboard over a newer one. Publish only when no later master commit
      # touched what the dashboard is built from; such a commit started its
      # own run. A later commit that touched nothing of it (docs, say)
      # starts no run, so it must not stop this one.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
          path: tip
      - name: Is this still the newest dashboard input?
        id: tip
        env:
          SHA: ${{ github.sha }}
        run: |
          NEWEST=$(git -C tip log -1 --format=%H master -- \
            ':(glob)**/performance_metrics_*.json' Testing/dashboard.py \
            Testing/retired_configurations.json Testing/drift.py \
            ':(glob)ParaView_Vignettes/*/*.py' ':(glob)VisIt_Vignettes/*/*.py' \
            .github/workflows/dashboard.yml)
          if git -C tip merge-base --is-ancestor "$NEWEST" "$SHA"; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "master has newer dashboard input ($NEWEST) than $SHA: not publishing"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        if: ${{ steps.tip.outputs.newest == 'true' }}
        with:
          name: dashboard
          path: site
      - name: Publish
        id: publish
        if: ${{ steps.tip.outputs.newest == 'true' }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/dashboard
          destination_dir: dashboard
          commit_message: 'dashboard: ${{ github.sha }}'
      # main.yml's badge step pushes to the same branch, and the action
      # neither rebases nor retries, so a push that lands in between is
      # rejected. Try once more from the new tip. (A shared concurrency
      # group would make this wait for main.yml's whole image build.)
      - name: Publish again if the branch moved
        if: ${{ steps.tip.outputs.newest == 'true' && steps.publish.outcome == 'failure' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/dashboard
          destination_dir: dashboard
          commit_message: 'dashboard: ${{ github.sha }}'
      # The root page, beside the badge: keep_files leaves every other file
      # on the branch alone. The dashboard steps above replace dashboard/
      # whole, so a page that is no longer generated disappears with it.
      - name: Publish the root page
        id: root
        if: ${{ steps.tip.outputs.newest == 'true' }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/root
          keep_files: true
          commit_message: 'root page: ${{ github.sha }}'
      - name: Publish the root page again if the branch moved
        if: ${{ steps.tip.outputs.newest == 'true' && steps.root.outcome == 'failure' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/root
          keep_files: true
          commit_message: 'root page: ${{ github.sha }}'
