repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-case-conflict
    -   id: check-json
-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    -   id: black
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck
- repo: https://github.com/PyCQA/flake8
  rev: 3.9.2
  hooks:
  -   id: flake8
      name: flake8
      types: [python]
      args:
      -   --max-line-length=88
      -   --ignore=E203,E501,W503,F403,F405
- repo: local
  hooks:
  -   id: workflow-shell
      name: workflow run blocks parse as shell
      # The runner writes each `run:` block to a file and runs bash on it, so
      # a quoting mistake there is a syntax error before any step executes.
      # One apostrophe inside a `bash -c '...'` payload took CI down twice.
      entry: python3 .github/scripts/check_workflow_shell.py
      language: system
      pass_filenames: false
      files: ^\.github/workflows/.*\.ya?ml$
